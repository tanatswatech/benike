<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Products | Benike Technologies</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header>

    <div class="logo">
        <img src="logo.png" alt="Benike Technologies">
    </div>

    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

</header>
<section class="featured">

    <h2 id="pageTitle">All Products</h2>

    <div class="product-categories">

        <a href="products.html?category=Phones" class="cat-pill">
            <img src="https://images.pexels.com/photos/19152408/pexels-photo-19152408/free-photo-of-back-of-red-smartphone.jpeg">
            <span>Phones</span>
        </a>

        <a href="products.html?category=Laptops" class="cat-pill">
            <img src="https://www.shutterstock.com/image-photo/cup-coffee-headphones-laptop-on-260nw-2502032037.jpg">
            <span>Laptops</span>
        </a>

        <a href="products.html?category=Starlink" class="cat-pill">
            <img src="https://cdn11.bigcommerce.com/s-de2pt6jzk5/images/stencil/1280x1280/products/15819/23656/4692_PCI_Starlink_Mini_Hard_Wire_Power_Cable_with_Step_up_Converter_4__42820.1752271825.jpg">
            <span>Starlink</span>
        </a>

        <a href="products.html?category=Audio" class="cat-pill">
            <img src="https://cdn2.37left.lk/images/anker-soundcore-r50i-nc-true-wireless-earbuds-30qPg9F7oCJU.webp">
            <span>Audio</span>
        </a>

        <a href="products.html?category=Gaming" class="cat-pill">
            <img src="https://i.pinimg.com/236x/ea/12/8f/ea128fd2f5382845126eab99c547c365.jpg">
            <span>Gaming</span>
        </a>

        <a href="products.html?category=Accessories" class="cat-pill">
            <img src="https://img.magnific.com/free-photo/fitness-gym-equipment-with-christmas-theme-decorations_23-2149564349.jpg?semt=ais_hybrid&w=740&q=80">
            <span>Accessories</span>
        </a>

        <a href="products.html" class="cat-pill">
            <img src="logo.png">
            <span>All</span>
        </a>

    </div>


    <div class="product-grid" id="productsContainer">

<script>

const products =
JSON.parse(localStorage.getItem("products")) || [];

const container =
document.getElementById("productsContainer");

const pageTitle =
document.getElementById("pageTitle");

const params =
new URLSearchParams(window.location.search);

const selectedCategory =
params.get("category");

let filteredProducts = products;

if(selectedCategory){

    filteredProducts =
    products.filter(product =>

        product.Category &&
        product.Category.toLowerCase() ===
        selectedCategory.toLowerCase()

    );

    pageTitle.innerText =
    selectedCategory.charAt(0).toUpperCase() +
    selectedCategory.slice(1);

}

if(filteredProducts.length === 0){

    container.innerHTML = `

    <div style="
        text-align:center;
        width:100%;
        padding:50px;
        font-size:20px;
    ">

        No products found.

    </div>

    `;

}

filteredProducts.forEach(product => {

    container.innerHTML += `

    <div class="product-card">

        <img
        src="${product.Image}"
        alt="${product.Name}"

        onerror="this.src='https://via.placeholder.com/300x250?text=No+Image'"
        >

        <h3>${product.Name}</h3>

       <p>
${
product.Price ||
product.price ||
product.Cost ||
product.cost ||
"Contact Us"
}
</p>

        <a
        href="https://wa.me/263784324361?text=Hello Benike Technologies, I would like to order ${product.Name}"
        class="buy-btn">

            WhatsApp Order

        </a>

    </div>

    `;

});

</script>

</body>
</html>
