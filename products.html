<html lang="en">
<head>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>
<header class="main-header">

    <div class="header-top">

        <div class="logo">
            <img src="logo.png" alt="Benike Technologies">
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>

    </div>

    <div class="header-categories">

        <a href="products.html?category=phones" class="header-category">
            <img src="https://images.pexels.com/photos/19152408/pexels-photo-19152408/free-photo-of-back-of-red-smartphone.jpeg">
            <span>Phones</span>
        </a>

        <a href="products.html?category=laptops" class="header-category">
            <img src="https://img.freepik.com/premium-photo/red-laptop-computer-with-geometric-abstract-design-screen-against-red-background-laptop-screen-red-background_939992-11163.jpg?w=360">
            <span>Laptops</span>
        </a>

        <a href="products.html?category=starlink" class="header-category">
            <img src="https://cdn11.bigcommerce.com/s-de2pt6jzk5/images/stencil/1280x1280/products/15819/23656/4692_PCI_Starlink_Mini_Hard_Wire_Power_Cable_with_Step_up_Converter_4__42820.1752271825.jpg">
            <span>Starlink</span>
        </a>

        <a href="products.html?category=audio" class="header-category">
            <img src="https://cdn2.37left.lk/images/anker-soundcore-r50i-nc-true-wireless-earbuds-30qPg9F7oCJU.webp">
            <span>Audio</span>
        </a>

        <a href="products.html?category=gaming" class="header-category">
            <img src="https://i.pinimg.com/236x/ea/12/8f/ea128fd2f5382845126eab99c547c365.jpg">
            <span>Gaming</span>
        </a>

        <a href="products.html?category=accessories" class="header-category">
            <img src="https://img.freepik.com/premium-photo/red-black-gaming-accessories-dark-background_1346134-20367.jpg">
            <span>Accessories</span>
        </a>

    </div>

</header>


    <div class="product-grid" id="productsContainer">

<script>

const products = JSON.parse(localStorage.getItem("products")) || [];

const container = document.getElementById("productsContainer");

const params = new URLSearchParams(window.location.search);

const selectedCategory = params.get("category");


let filteredProducts = products;


// CATEGORY FILTER
if (selectedCategory) {

    filteredProducts = products.filter(product => {

        const productCategory =
            product.Category ||
            product.category ||
            product.CATEGORY ||
            "";

        return productCategory.toLowerCase() === 
        selectedCategory.toLowerCase();

    });

}



// IF NOTHING FOUND
if(filteredProducts.length === 0){

    container.innerHTML = `

    <div style="
        text-align:center;
        width:100%;
        padding:50px;
        font-size:20px;
    ">

        No products found in ${selectedCategory || "this category"}.

    </div>

    `;

}



// DISPLAY PRODUCTS

filteredProducts.forEach(product => {


container.innerHTML += `

<div class="product-card">


<img

src="${product.Image || product.image}"

alt="${product.Name || product.name}"

onerror="this.src='https://via.placeholder.com/300x250?text=No+Image'"

>


<h3>

${product.Name || product.name}

</h3>


<p>

${
product.Price ||
product.price ||
product.Cost ||
product.cost ||
"Contact Us"

}

</p>



<a

href="https://wa.me/263784324361?text=Hello Benike Technologies, I would like to order ${product.Name || product.name}"

class="buy-btn"

>

WhatsApp Order

</a>


</div>


`;

});


</script>
</body>
</html>
